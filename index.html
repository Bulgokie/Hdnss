<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Rescue</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5F4;--ink:#14262B;--card:#fff;--line:#C9D4D2;--ok:#1F8A5B;--warn:#E0A100;--bad:#D9381E;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F1A1D;--ink:#E8F0EE;--card:#18272B;--line:#2E4348;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Thai",system-ui,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;font-weight:800;margin:8px 0 2px}
p.sub{margin:0 0 14px;opacity:.75}
.cam{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3}
video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.status{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;font-weight:600;color:#fff;background:var(--ok);transition:background .2s}
.status.warn{background:var(--warn);color:#14262B}
.status.bad{background:var(--bad)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
button{font:inherit;font-weight:600;padding:12px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.meter div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.85rem}
.meter b{display:block;font-size:1.2rem}
#ask{display:none;position:fixed;inset:0;background:var(--bad);color:#fff;z-index:9;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
#ask.on{display:flex}
#ask h2{font-size:2rem;margin:0}
#count{font-size:5rem;font-weight:800;line-height:1}
#imok{font-size:1.6rem;padding:22px 36px;background:#fff;color:var(--bad);border:0;border-radius:16px}
details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
label{display:block;margin:8px 0 2px;font-size:.9rem}
input{width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
#log{font-size:.85rem;max-height:180px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
#log div{padding:2px 0;border-bottom:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Smart Rescue</h1>
  <p class="sub">ตั้งมือถือหรือไอแพดให้กล้องหันเห็นหน้าคนขับ แล้วกดเริ่มเฝ้าระวัง</p>

  <div class="cam">
    <video id="video" autoplay playsinline muted></video>
    <div id="status" class="status">ยังไม่เริ่ม</div>
  </div>

  <div class="meter">
    <div>ตาปิดนาน<b id="mEyes">0.0 วิ</b></div>
    <div>ไม่เห็นหน้า<b id="mFace">0.0 วิ</b></div>
    <div>แรงสั่น<b id="mG">0.0</b></div>
  </div>

  <div class="row">
    <button class="main" id="start">เริ่มเฝ้าระวัง</button>
    <button id="sim">จำลองอุบัติเหตุ</button>
  </div>

  <details>
    <summary>ตั้งค่า</summary>
    <label for="tok">Telegram Bot Token</label><input id="tok" placeholder="123456:ABC...">
    <label for="chat">Telegram Chat ID ของญาติ</label><input id="chat" placeholder="เช่น 123456789">
    <label for="tel">เบอร์ญาติ (ใช้ปุ่มโทร)</label><input id="tel" inputmode="tel" placeholder="08xxxxxxxx">
    <div class="row"><button id="save">บันทึก</button></div>
  </details>

  <div id="log" aria-live="polite"></div>
</main>

<div id="ask" role="alertdialog" aria-live="assertive">
  <h2 id="reason">ตรวจพบความผิดปกติ</h2>
  <div>คุณโอเคไหม? กดปุ่มภายใน</div>
  <div id="count">15</div>
  <button id="imok">ฉันปกติ</button>
</div>

<script type="module">
import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

/* ===== ค่าที่ปรับได้ ===== */
const EYES_CLOSED_MS = 3000;   // ตาปิดนานเกินนี้ถือว่าผิดปกติ
const NO_FACE_MS     = 5000;   // ไม่เห็นหน้านานเกินนี้
const BLINK_LIMIT    = 0.5;    // ค่า blendshape ตาปิด (0-1)
const IMPACT_G       = 25;     // แรงสั่น m/s² (แรงโน้มถ่วงปกติ ~9.8)
const ASK_SECONDS    = 15;     // เวลารอคำตอบ

const $ = id => document.getElementById(id);
const video = $("video"), statusEl = $("status");
let landmarker, state = "idle"; // idle | monitoring | asking | alerted
let eyesSince = 0, faceLostSince = 0, lastTrigger = 0, askTimer, speakTimer, wakeLock;

/* ===== ตั้งค่า ===== */
const cfg = JSON.parse(localStorage.getItem("sr_cfg") || "{}");
$("tok").value = cfg.tok || ""; $("chat").value = cfg.chat || ""; $("tel").value = cfg.tel || "";
$("save").onclick = () => {
  Object.assign(cfg, { tok: $("tok").value.trim(), chat: $("chat").value.trim(), tel: $("tel").value.trim() });
  localStorage.setItem("sr_cfg", JSON.stringify(cfg)); log("บันทึกการตั้งค่าแล้ว");
};

function log(t){ const d=document.createElement("div"); d.textContent=new Date().toLocaleTimeString("th-TH")+"  "+t; $("log").prepend(d); }
function setStatus(t, cls=""){ statusEl.textContent=t; statusEl.className="status "+cls; }
function speak(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang="th-TH"; speechSynthesis.speak(u);}catch{} }

/* ===== เริ่มระบบ ===== */
$("start").onclick = async () => {
  try {
    $("start").disabled = true; setStatus("กำลังโหลดโมเดล...", "warn");
    // iOS ต้องขอสิทธิ์เซนเซอร์จากการกดปุ่ม
    if (typeof DeviceMotionEvent !== "undefined" && DeviceMotionEvent.requestPermission) {
      await DeviceMotionEvent.requestPermission();
    }
    window.addEventListener("devicemotion", onMotion);
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
    const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    landmarker = await FaceLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" },
      runningMode: "VIDEO", numFaces: 1, outputFaceBlendshapes: true
    });
    try { wakeLock = await navigator.wakeLock.request("screen"); } catch {}
    state = "monitoring"; setStatus("ปกติ กำลังเฝ้าระวัง"); log("เริ่มเฝ้าระวัง");
    requestAnimationFrame(loop);
  } catch (e) { setStatus("เริ่มไม่ได้: " + e.message, "bad"); log("ผิดพลาด: " + e.message); $("start").disabled = false; }
};

/* ===== ตรวจใบหน้า ===== */
function loop(){
  if (state === "monitoring" && video.readyState >= 2) {
    const now = performance.now();
    const res = landmarker.detectForVideo(video, now);
    if (res.faceLandmarks.length) {
      faceLostSince = 0;
      const b = res.faceBlendshapes[0].categories;
      const get = n => b.find(c => c.categoryName === n)?.score ?? 0;
      const closed = (get("eyeBlinkLeft") + get("eyeBlinkRight")) / 2 > BLINK_LIMIT;
      if (closed) { eyesSince ||= now; } else { eyesSince = 0; }
    } else { eyesSince = 0; faceLostSince ||= now; }

    const eyesFor = eyesSince ? now - eyesSince : 0;
    const faceFor = faceLostSince ? now - faceLostSince : 0;
    $("mEyes").textContent = (eyesFor/1000).toFixed(1) + " วิ";
    $("mFace").textContent = (faceFor/1000).toFixed(1) + " วิ";
    if (eyesFor > 800 || faceFor > 1500) setStatus("สังเกตเห็นความผิดปกติ...", "warn"); else setStatus("ปกติ กำลังเฝ้าระวัง");
    if (eyesFor > EYES_CLOSED_MS) trigger("ตาปิดนานผิดปกติ");
    else if (faceFor > NO_FACE_MS) trigger("ไม่เห็นหน้าคนขับ");
  }
  requestAnimationFrame(loop);
}

/* ===== ตรวจแรงกระแทก ===== */
function onMotion(e){
  const a = e.accelerationIncludingGravity; if (!a) return;
  const g = Math.hypot(a.x||0, a.y||0, a.z||0);
  $("mG").textContent = g.toFixed(1);
  if (state === "monitoring" && g > IMPACT_G) trigger("ตรวจพบแรงกระแทก");
}

/* ===== ถามคนขับ ===== */
function trigger(reason){
  if (state !== "monitoring" || performance.now() - lastTrigger < 5000) return;
  state = "asking"; lastTrigger = performance.now();
  log("ผิดปกติ: " + reason);
  $("reason").textContent = reason; $("ask").classList.add("on");
  let left = ASK_SECONDS; $("count").textContent = left;
  const say = () => speak("คุณโอเคไหม กดปุ่มฉันปกติ");
  say(); speakTimer = setInterval(say, 5000);
  askTimer = setInterval(() => {
    $("count").textContent = --left;
    if (left <= 0) { stopAsk(); alertRelatives(reason); }
  }, 1000);
}
function stopAsk(){ clearInterval(askTimer); clearInterval(speakTimer); speechSynthesis.cancel(); $("ask").classList.remove("on"); }
$("imok").onclick = () => { stopAsk(); state = "monitoring"; eyesSince = 0; faceLostSince = 0; log("คนขับกดยืนยันว่าปกติ"); setStatus("ปกติ กำลังเฝ้าระวัง"); };
$("sim").onclick = () => { if (state === "monitoring") trigger("จำลองอุบัติเหตุ"); else log("กด 'เริ่มเฝ้าระวัง' ก่อน"); };

/* ===== แจ้งเตือนญาติ ===== */
function getPos(){ return new Promise(r => navigator.geolocation ? navigator.geolocation.getCurrentPosition(p => r(p.coords), () => r(null), { timeout: 5000 }) : r(null)); }

async function alertRelatives(reason){
  state = "alerted"; setStatus("คนขับไม่ตอบ กำลังแจ้งเตือน", "bad"); log("ไม่มีการตอบ เริ่มแจ้งเตือน");
  const pos = await getPos();
  const map = pos ? `https://maps.google.com/?q=${pos.latitude},${pos.longitude}` : "ไม่ทราบตำแหน่ง";
  const text = `🚨 Smart Rescue: ${reason}\nคนขับไม่ตอบภายใน ${ASK_SECONDS} วินาที\nตำแหน่ง: ${map}`;
  if (cfg.tok && cfg.chat) {
    try {
      const r = await fetch(`https://api.telegram.org/bot${cfg.tok}/sendMessage`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ chat_id: cfg.chat, text })
      });
      log(r.ok ? "ส่ง Telegram ถึงญาติแล้ว" : "ส่ง Telegram ไม่สำเร็จ (" + r.status + ")");
    } catch (e) { log("ส่ง Telegram ไม่สำเร็จ: " + e.message); }
  } else log("ยังไม่ได้ตั้งค่า Telegram (ข้อความที่จะส่ง: " + text.replace(/\n/g, " | ") + ")");

  // เว็บโทรออกเองไม่ได้ จึงแสดงปุ่มให้กดโทร (ตอนทดสอบให้ใช้เบอร์เพื่อน อย่าโทรเบอร์ฉุกเฉินจริง)
  const row = document.createElement("div"); row.className = "row";
  row.innerHTML = `<a href="tel:${cfg.tel || ""}"><button class="main">โทรหาญาติ</button></a><a href="tel:1669"><button>โทร 1669</button></a><button id="reset">กลับไปเฝ้าระวัง</button>`;
  $("log").before(row);
  row.querySelector("#reset").onclick = () => { row.remove(); state = "monitoring"; eyesSince = 0; faceLostSince = 0; setStatus("ปกติ กำลังเฝ้าระวัง"); };
}
</script>
</body>
</html>
